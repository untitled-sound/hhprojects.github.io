<body>
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
            <!-- Spray-paint edge for large stencil type -->
            <filter id="spray" x="-3%" y="-5%" width="106%" height="112%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" result="d"/>
                <feGaussianBlur in="d" stdDeviation="1.1" result="b"/>
                <feComponentTransfer in="b"><feFuncA type="linear" slope="2.6" intercept="-0.7"/></feComponentTransfer>
            </filter>
            <!-- Same idea, gentler, for small marks -->
            <filter id="spray-fine" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G" result="d"/>
                <feGaussianBlur in="d" stdDeviation="0.5" result="b"/>
                <feComponentTransfer in="b"><feFuncA type="linear" slope="2.2" intercept="-0.5"/></feComponentTransfer>
            </filter>
        </defs>
    </svg>
